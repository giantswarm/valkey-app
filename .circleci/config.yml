version: 2.1
orbs:
  architect: giantswarm/architect@10.6.2

jobs:
  # helm lint of the wrapper chart and the vendored subchart plus the
  # helm-unittest suites in helm/valkey/charts/valkey/tests/ (what the
  # Deployment and the Secret render from the values). The unittest plugin is
  # not in the app-build-suite image, so the job runs in a plain container
  # with a pinned helm.
  chart-test:
    docker:
      - image: cimg/base:current
    resource_class: small
    environment:
      HELM_VERSION: v3.16.0
    steps:
      - checkout
      - run:
          name: Install helm
          command: |
            set -euxo pipefail
            curl -sSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" | tar -xz -C /tmp
            sudo install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm
            helm version --short
      - run:
          name: Run chart tests
          command: make helm-test

workflows:
  test:
    jobs:
    - chart-test:
        filters:
          tags:
            only: /^v.*/
  package-and-push-chart-on-tag:
    jobs:
    - architect/push-to-app-catalog:
        context: architect
        executor: app-build-suite
        name: package-and-push-chart
        app_catalog: giantswarm-catalog
        app_catalog_test: giantswarm-test-catalog
        chart: 'valkey'
          # Trigger job on git tag.
        filters:
          tags:
            only: /^v.*/
          branches:
            ignore:
            - main
