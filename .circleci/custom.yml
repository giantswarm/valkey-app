# Repo-owned. The setup workflow in .circleci/config.yml deep-merges this file
# into the generated .circleci/workflows.yml at pipeline runtime, appending
# these jobs to the generated ones. devctl never touches it.
version: 2.1

jobs:
  # `make helm-test`: helm lint of the wrapper and the vendored subchart, the
  # helm-unittest suites in tests/chart/, and `make verify-sync`, which
  # re-vendors the pinned upstream chart, applies sync/patches and fails when
  # the tree differs (it fetches from the upstream chart repository).
  chart-test:
    docker:
      - image: cimg/python:3.14
    resource_class: small
    environment:
      HELM_VERSION: v3.16.0
      VENDIR_VERSION: v0.32.2
      VENDIR_SHA256: f5d3cbbd8135d2d48f4f007b8a933bd60b2a827d68f4001c5d1774392fa7b3f2
    steps:
      - checkout
      - run:
          name: Install helm and vendir
          command: |
            set -euxo pipefail
            curl -sSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" | tar -xz -C /tmp
            sudo install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm
            curl -sSL -o /tmp/vendir "https://github.com/carvel-dev/vendir/releases/download/${VENDIR_VERSION}/vendir-linux-amd64"
            echo "${VENDIR_SHA256}  /tmp/vendir" | sha256sum -c -
            sudo install -m 0755 /tmp/vendir /usr/local/bin/vendir
            helm version --short
            vendir version | head -1
      - run:
          name: Run chart tests
          command: make helm-test

workflows:
  build:
    jobs:
    - chart-test:
        filters:
          branches:
            ignore:
            - main
