{{- /*
The store's network policy. Egress: DNS. Ingress: only the store's consumers.
Cilium policies are additive, so an open rule here (the cluster entity) could
not be narrowed by any other policy. The policy admits:

  - ciliumNetworkPolicy.ingress.clients (by default every pod of the release's
    namespace) and ciliumNetworkPolicy.ingress.additionalPeers on the Valkey
    port;
  - ciliumNetworkPolicy.ingress.metricsScrapers on the exporter port while
    metrics are on;
  - both with Cilium mutual authentication when
    ciliumNetworkPolicy.ingress.authentication.mode is set;
  - the kubelet's probes on every port: they arrive from the host entity.
*/ -}}
{{- if .Values.ciliumNetworkPolicy.enabled }}
{{- $ingress := .Values.ciliumNetworkPolicy.ingress }}
{{- $peers := concat ($ingress.clients | default list) ($ingress.additionalPeers | default list) }}
{{- $authMode := dig "authentication" "mode" "" $ingress }}
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ include "name" . }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      {{- include "labels.selector" . | nindent 6 }}
  egress:
    # Allow DNS resolution
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: coredns
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: k8s-dns-node-cache
      toPorts:
        - ports:
            - port: "1053"
              protocol: UDP
            - port: "1053"
              protocol: TCP
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
  ingress:
    {{- if $peers }}
    # Valkey clients
    - fromEndpoints:
        {{- range $peers }}
        - matchLabels:
            {{- with .matchLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            io.kubernetes.pod.namespace: {{ .namespace | default $.Release.Namespace }}
        {{- end }}
      {{- with $authMode }}
      authentication:
        mode: {{ . | quote }}
      {{- end }}
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
    {{- end }}
    {{- if and .Values.valkey.metrics.enabled $ingress.metricsScrapers }}
    # Prometheus metrics scraping
    - fromEndpoints:
        {{- range $ingress.metricsScrapers }}
        - matchLabels:
            {{- toYaml .matchLabels | nindent 12 }}
            io.kubernetes.pod.namespace: {{ .namespace }}
        {{- end }}
      {{- with $authMode }}
      authentication:
        mode: {{ . | quote }}
      {{- end }}
      toPorts:
        - ports:
            - port: "9121"
              protocol: TCP
    {{- end }}
    # The kubelet's probes
    - fromEntities:
        - host
{{- end }}
