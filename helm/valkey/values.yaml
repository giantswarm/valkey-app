# This file is a Helm values file for the valkey chart.
#
# To learn more about how to configure your app on your cluster
# and override the default values in here, visit:
#
#   https://docs.giantswarm.io/tutorials/fleet-management/app-platform/app-configuration/#basic-values-merging-example
#

# -- Read by a parent chart that lists valkey as a dependency with
# `condition: valkey.enabled` (giantswarm-repo-manager, the fleet bases): Helm
# hands the subchart the key it switched on, and the closed schema would refuse
# it. This chart itself does not read it.
enabled: true

# The upstream subchart's values, validated by its own values.schema.json:
# the wrapper schema leaves the block open instead of mirroring it.
valkey:  # @schema skipProperties: true; additionalProperties: true
  # Configuration for the Valkey image
  image:
    # Use Giant Swarm's container registry
    registry: gsoci.azurecr.io
    repository: giantswarm/valkey

  # Enable metrics for monitoring
  metrics:
    enabled: true
    exporter:
      image:
        registry: gsoci.azurecr.io
        repository: giantswarm/redis_exporter
        # Renovate follows the tag on the gsoci mirror, which retagger fills
        # on its own schedule, so a bump is proposed only once it can be
        # pulled. The vendored subchart's default tag is upstream's.
        tag: "v1.93.0"
      # Security context for metrics exporter container
      securityContext:
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 1000
      # Resource limits/requests for metrics exporter
      resources:
        limits:
          cpu: 100m
          memory: 128Mi
        requests:
          cpu: 50m
          memory: 64Mi
    # Enable PodMonitor for Prometheus scraping
    podMonitor:
      enabled: true
      # Labels for the PodMonitor resource. On Giant Swarm installations the
      # monitoring agent (alloy-metrics) selects PodMonitors by a label on
      # the PodMonitor *object*, with two alternatives (verified against
      # alloy-metrics' rendered config on a live MC):
      #
      #   observability.giantswarm.io/tenant In [<tenant>]      -- current
      #   application.giantswarm.io/team Exists                 -- "legacy",
      #     and only when observability.giantswarm.io/tenant is absent
      #
      # A PodMonitor matching neither selector is created and silently never
      # scraped. These labels must live under `extraLabels`: the subchart's
      # podmonitor.yaml renders only `extraLabels`, while its
      # `additionalLabels` key is documented in the subchart values but never
      # consumed by any template.
      extraLabels:
        observability.giantswarm.io/tenant: giantswarm

  # Resource limits/requests for Valkey. Every container that mounts an
  # emptyDir sets ephemeral-storage requests and limits (Kyverno's
  # require-emptydir-requests-and-limits policy): the memory-backed ACL volume
  # with auth on, and /data while `dataStorage` provides no volume. There
  # Valkey writes its snapshots, up to the dataset (the memory limit) plus the
  # temporary file of a save, so the limit is twice the memory limit.
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
      ephemeral-storage: 1Gi
    requests:
      cpu: 100m
      memory: 128Mi
      ephemeral-storage: 128Mi

  # Resource limits/requests for init container. It writes the generated
  # valkey.conf, its log and the ACL file: a few KiB.
  initResources:
    limits:
      cpu: 100m
      memory: 128Mi
      ephemeral-storage: 64Mi
    requests:
      cpu: 50m
      memory: 64Mi
      ephemeral-storage: 16Mi

ciliumNetworkPolicy:
  enabled: true
  # Ingress to the store. Cilium policies are additive, so an open rule here
  # (the cluster entity) could not be narrowed by the consumer's own policies:
  # the policy admits only the peers below. Each peer is a namespace and the
  # labels of its pods; an empty namespace is the release's namespace, empty
  # matchLabels every pod of that namespace. The kubelet's probes (the host
  # entity) are admitted on every port.
  ingress:
    # Cilium mutual authentication for the fromEndpoints rules below: `required`
    # on a cluster whose Cilium runs mutual authentication (SPIFFE/SPIRE) and
    # whose admission policy demands it on every pod-to-pod rule, `disabled` to
    # say so explicitly; empty renders the rules without an authentication
    # field. The kubelet's probes (the host entity) never authenticate.
    authentication:
      mode: ""  # @schema enum: ["", "disabled", "required"]
    # The consumers admitted on the Valkey port: by default every pod of the
    # release's namespace, where a consumer deploys its store beside itself.
    clients:  # @schema item: object; itemProperties: {"namespace": {"type": "string"}, "matchLabels": {"type": "object", "additionalProperties": {"type": "string"}}}
      - namespace: ""
        matchLabels: {}
    # The metrics collectors admitted on the exporter port: the observability
    # platform's alloy-metrics by default.
    metricsScrapers:  # @schema item: object; itemRequired: [namespace, matchLabels]; itemProperties: {"namespace": {"type": "string", "minLength": 1}, "matchLabels": {"type": "object", "minProperties": 1, "additionalProperties": {"type": "string"}}}
      - namespace: kube-system
        matchLabels:
          app.kubernetes.io/instance: alloy-metrics
    # Further clients admitted on the Valkey port, e.g. a consumer in another
    # namespace. Example:
    #   additionalPeers:
    #     - namespace: my-app
    #       matchLabels:
    #         app.kubernetes.io/name: my-app
    additionalPeers: []  # @schema item: object; itemRequired: [namespace, matchLabels]; itemProperties: {"namespace": {"type": "string", "minLength": 1}, "matchLabels": {"type": "object", "minProperties": 1, "additionalProperties": {"type": "string"}}}

vpa:
  enabled: true
  containerPolicies:
    minAllowed:
      cpu: "50m"

# Not read by this chart: Valkey's authentication is `valkey.auth`. Installations
# that set a top-level `auth` block (accepted by 0.1.x, whose schema left the
# root open) keep upgrading; the block has no effect.
auth: {}  # @schema additionalProperties: true
