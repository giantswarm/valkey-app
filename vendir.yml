apiVersion: vendir.k14s.io/v1alpha1
kind: Config
minimumRequiredVersion: 0.12.0
directories:
# The published upstream chart, unmodified. `make update-chart` re-vendors it
# and re-applies the Giant Swarm delta from sync/patches/ (sync/patch.sh);
# nothing in helm/valkey/charts/valkey is edited by hand. Renovate's vendir
# manager follows the version and pushes the renovate/vendir/** branch the
# upstream sync starts from.
- path: helm/valkey/charts/valkey
  contents:
  - path: .
    helmChart:
      name: valkey
      version: "0.12.0"
      repository:
        url: https://valkey.io/valkey-helm/
